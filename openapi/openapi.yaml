openapi: 3.1.0
info:
  title: SLSEA Solar Generation API
  description: |
    Real-time and historical generation data for Sri Lanka's rooftop solar estate.

    ## Authentication

    All endpoints require JWT bearer tokens (HS256) except `/auth/login` and `/auth/device-token`.
    Provide the token in the `Authorization` header: `Bearer <token>`.

    Two token types:
    - **User tokens** (`typ: 'user'`) — identify a person scoped to a jurisdiction (province, district)
    - **Device tokens** (`typ: 'device'`) — identify a metering device bound to a single installation

    ## Authorization rules

    - **Scope:** Every endpoint enforces a minimum scope (e.g., `installations:read`, `readings:write`)
    - **Principal type:** Some endpoints are user-only, others device-only
    - **Admin role:** Writes to installations require `role: 'admin'`
    - **Jurisdiction:** Reads scoped to the user's province or district; devices can only write to their own installation

    ## Important status code rules

    - **404 not 403 on reads:** A cross-jurisdiction read returns 404, identical to a missing resource — a 403 would confirm the resource exists
    - **INSTALLATION_MISMATCH exception:** A device posting to an installation that is not its own gets 403 (not 404), because the device already knows its own site exists
    - **?at= on summary:** The `?at=ISO-8601` parameter on `/districts/{id}/generation-summary` computes the summary "as of" that instant, defaulting to now

    ## Readings are append-only

    A replayed reading (same installation and `recorded_at`) returns 409 Conflict with a `Location` header pointing at the existing reading. The database enforces this: the application's MySQL user holds only `SELECT, INSERT` on `readings`.

    ## Seed data

    - Kandy is district 4 in province 2
    - Readings are every 15 minutes (672 per installation per 7 days)
    - `energy_kwh` is a cumulative lifetime counter, monotonic per installation — a period's energy is `last − first`, never a sum
  version: 1.0.0
  contact:
    name: SLSEA
    url: https://www.energy.gov.lk

servers:
  - url: https://4qfu2ftwie.execute-api.us-east-1.amazonaws.com/api/v1
    description: Production
  - url: http://localhost:5000/api/v1
    description: Local development

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT bearer token (HS256). Provide in Authorization header.

  schemas:
    Error:
      type: object
      required: [ error ]
      properties:
        error:
          type: object
          required: [ code, message, details, request_id, timestamp ]
          properties:
            code:
              type: string
              enum:
                - AUTHENTICATION_REQUIRED
                - INVALID_TOKEN
                - INSUFFICIENT_SCOPE
                - PERMISSION_DENIED
                - INSTALLATION_MISMATCH
                - NOT_FOUND
                - VALIDATION_FAILED
                - CONFLICT
                - PRECONDITION_FAILED
                - PAYLOAD_TOO_LARGE
                - UNSUPPORTED_MEDIA_TYPE
                - METHOD_NOT_ALLOWED
                - NOT_ACCEPTABLE
                - TOO_MANY_REQUESTS
                - INTERNAL_ERROR
              description: Machine-readable error code
            message:
              type: string
              description: Human-readable error message
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                    description: Field name (for validation errors)
                  issue:
                    type: string
                    description: Description of the issue
              description: Validation details (empty for non-validation errors)
            request_id:
              type: string
              format: uuid
              description: Unique request identifier for logging
            timestamp:
              type: string
              format: date-time
              description: ISO 8601 timestamp with timezone

    Pagination:
      type: object
      required: [ total_count, limit, offset, returned ]
      properties:
        total_count:
          type: integer
          minimum: 0
          description: Total number of resources matching the query
        limit:
          type: integer
          minimum: 1
          maximum: 200
          description: Page size
        offset:
          type: integer
          minimum: 0
          description: Offset from the start of the collection
        returned:
          type: integer
          description: Number of resources in this page

    Links:
      type: object
      required: [ self, first, prev, next, last ]
      properties:
        self:
          type: string
          format: uri
          description: Link to this page
        first:
          type: string
          format: uri
          description: Link to the first page
        prev:
          type: string
          format: uri
          nullable: true
          description: Link to the previous page (null on first page)
        next:
          type: string
          format: uri
          nullable: true
          description: Link to the next page (null on last page)
        last:
          type: string
          format: uri
          description: Link to the last page

    Province:
      type: object
      required: [ province_id, name ]
      properties:
        province_id:
          type: integer
          example: 2
        name:
          type: string
          example: Central Province

    District:
      type: object
      required: [ district_id, province_id, name ]
      properties:
        district_id:
          type: integer
          example: 4
        province_id:
          type: integer
          example: 2
        name:
          type: string
          example: Kandy

    GridSubstation:
      type: object
      required: [ substation_id, district_id, province_id, name ]
      properties:
        substation_id:
          type: integer
          example: 8
        district_id:
          type: integer
          example: 4
        province_id:
          type: integer
          example: 2
        name:
          type: string
          example: Kandy Central

    Installation:
      type: object
      required:
        - installation_id
        - reference
        - meter_id
        - inverter_id
        - substation_id
        - province_id
        - district_id
        - capacity_kw
        - panel_count
        - status
        - commissioned_on
        - address_line
        - latitude
        - longitude
      properties:
        installation_id:
          type: integer
          example: 61
        reference:
          type: string
          maxLength: 32
          example: KANDY-CENTRAL-001
        meter_id:
          type: string
          maxLength: 32
          example: MTR-000042
        inverter_id:
          type: string
          maxLength: 48
          example: INV-SMA-2025
        substation_id:
          type: integer
          example: 8
        province_id:
          type: integer
          example: 2
        district_id:
          type: integer
          example: 4
        capacity_kw:
          type: number
          format: double
          example: 10.5
        panel_count:
          type: integer
          example: 28
        status:
          type: string
          enum: [ active, inactive, decommissioned ]
          example: active
        commissioned_on:
          type: string
          format: date
          example: "2024-01-15"
        address_line:
          type: string
          maxLength: 160
          example: 123 Temple Road, Kandy
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 6.9271
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: 80.7789

    Reading:
      type: object
      required:
        - reading_id
        - installation_id
        - recorded_at
        - power_kw
        - energy_kwh
        - voltage_v
      properties:
        reading_id:
          type: integer
          example: 42560
        installation_id:
          type: integer
          example: 61
        recorded_at:
          type: string
          format: date-time
          description: ISO 8601 with offset
          example: "2026-09-24T14:30:00+05:30"
        power_kw:
          type: number
          format: double
          minimum: 0
          maximum: 1000
          description: Instantaneous power in kilowatts
          example: 6.2
        energy_kwh:
          type: number
          format: double
          minimum: 0
          description: Cumulative lifetime energy in kilowatt-hours
          example: 44.5
        voltage_v:
          type: number
          format: double
          minimum: 0
          maximum: 500
          description: Grid voltage in volts
          example: 232.1

    Overview:
      type: object
      required:
        - installation
        - substation
        - district
        - province
        - last_reading
        - today_energy
        - lifetime_energy
        - capacity_utilization_percent
      properties:
        installation:
          $ref: '#/components/schemas/Installation'
        substation:
          $ref: '#/components/schemas/GridSubstation'
        district:
          $ref: '#/components/schemas/District'
        province:
          $ref: '#/components/schemas/Province'
        last_reading:
          $ref: '#/components/schemas/Reading'
        today_energy:
          type: number
          format: double
          description: Total energy generated today (kWh)
          example: 52.3
        lifetime_energy:
          type: number
          format: double
          description: Cumulative lifetime energy (kWh)
          example: 1847.6
        capacity_utilization_percent:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Percentage of nominal capacity currently in use
          example: 59.0

    LastKnownReading:
      $ref: '#/components/schemas/Reading'

    GenerationSummary:
      type: object
      required:
        - district_id
        - recorded_at
        - total_power_kw
        - total_energy_kwh
        - active_installations
        - stale_installations
      properties:
        district_id:
          type: integer
          example: 4
        recorded_at:
          type: string
          format: date-time
          description: The instant "as of" which this summary was computed
          example: "2026-09-24T14:30:00Z"
        total_power_kw:
          type: number
          format: double
          description: Sum of instantaneous power across all installations
          example: 127.5
        total_energy_kwh:
          type: number
          format: double
          description: Today's energy generated (sum of all installations' delta)
          example: 1850.3
        active_installations:
          type: integer
          description: Installations with readings today
          example: 12
        stale_installations:
          type: integer
          description: Installations with no readings today (flagged as stale)
          example: 2

    User:
      type: object
      required: [ user_id, email, role, jurisdiction ]
      properties:
        user_id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: kandy.officer@slsea.lk
        role:
          type: string
          enum: [ analyst, officer, admin ]
          example: officer
        jurisdiction:
          type: object
          required: [ level, province_id ]
          properties:
            level:
              type: string
              enum: [ national, province, district ]
              example: district
            province_id:
              type: integer
              example: 2
            district_id:
              type: integer
              example: 4

    AuthLoginResponse:
      type: object
      required: [ token, user ]
      properties:
        token:
          type: string
          format: jwt
          description: JWT bearer token for Authorization header
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: '#/components/schemas/User'

    AuthDeviceTokenResponse:
      type: object
      required: [ token, installation ]
      properties:
        token:
          type: string
          format: jwt
          description: JWT bearer token for Authorization header
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        installation:
          type: object
          required: [ installation_id, meter_id ]
          properties:
            installation_id:
              type: integer
              example: 61
            meter_id:
              type: string
              example: MTR-000042

    ProvinceCollection:
      type: object
      required: [ data, pagination, links ]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Province'
        pagination:
          $ref: '#/components/schemas/Pagination'
        links:
          $ref: '#/components/schemas/Links'

    DistrictCollection:
      type: object
      required: [ data, pagination, links ]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/District'
        pagination:
          $ref: '#/components/schemas/Pagination'
        links:
          $ref: '#/components/schemas/Links'

    GridSubstationCollection:
      type: object
      required: [ data, pagination, links ]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/GridSubstation'
        pagination:
          $ref: '#/components/schemas/Pagination'
        links:
          $ref: '#/components/schemas/Links'

    InstallationCollection:
      type: object
      required: [ data, pagination, links ]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Installation'
        pagination:
          $ref: '#/components/schemas/Pagination'
        links:
          $ref: '#/components/schemas/Links'

    ReadingCollection:
      type: object
      required: [ data, pagination, links ]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Reading'
        pagination:
          $ref: '#/components/schemas/Pagination'
        links:
          $ref: '#/components/schemas/Links'

    CreateInstallationResponse:
      allOf:
        - $ref: '#/components/schemas/Installation'
        - type: object
          required: [ device_secret ]
          properties:
            device_secret:
              type: string
              description: The device secret for this installation (returned once, here only)
              example: secret-device-key-unique-to-this-installation
  responses:
    NotModified:
      description: Not Modified — the If-None-Match ETag matches (or, when no If-None-Match is sent, If-Modified-Since is not older than Last-Modified). The body is empty.
      headers:
        ETag:
          description: The current ETag, unchanged
          schema:
            type: string
    UnsupportedMediaType:
      description: The request body was not sent as application/json
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [ Authentication ]
      summary: User login
      description: Authenticate as an SLSEA staff member and receive a user token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ email, password ]
              properties:
                email:
                  type: string
                  format: email
                  example: kandy.officer@slsea.lk
                password:
                  type: string
                  example: replace-with-the-seeded-password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
        '400':
          description: Malformed request body — missing field, invalid email format, unknown field, or invalid JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: >-
            Unknown email, wrong password, or inactive account. All three return the identical body, so the response cannot be used to discover which emails exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INVALID_CREDENTIALS
                  message: Invalid email or password.
                  details: []
                  request_id: e18f905a-4fd1-48a4-afca-cce13f86fd07
                  timestamp: '2026-09-25T13:51:17.418Z'
        '429':
          description: Too many login attempts
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

  /auth/device-token:
    post:
      tags: [ Authentication ]
      summary: Device login
      description: Authenticate as a metering device and receive a device token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ meter_id, device_secret ]
              properties:
                meter_id:
                  type: string
                  example: MTR-000042
                device_secret:
                  type: string
                  example: replace-with-the-seeded-device-secret
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthDeviceTokenResponse'
        '400':
          description: Malformed request body — missing field, unknown field, or invalid JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: >-
            Unknown meter_id, wrong device_secret, or an installation that is not active. All three return the identical body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INVALID_CREDENTIALS
                  message: Invalid meter ID or device secret.
                  details: []
                  request_id: 3b1f0c2e-7a4d-4e9b-8c6f-2d5a9e1b7c40
                  timestamp: '2026-09-25T13:51:17.418Z'
        '429':
          description: Too many login attempts
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

  /provinces:
    get:
      tags: [ Hierarchy ]
      summary: List provinces
      description: List all provinces (user-only, requires installations:read scope)
      operationId: listProvinces
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: sort
          in: query
          schema:
            type: string
          description: Sort field, format "field:asc" or "field:desc"
      responses:
        '200':
          description: List of provinces
          headers:
            ETag:
              schema:
                type: string
              description: Entity tag for caching
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvinceCollection'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient scope (device tokens not allowed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '406':
          description: Unsupported media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Payload too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Unsupported media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "304":
          $ref: "#/components/responses/NotModified"

  /provinces/{id}:
    get:
      tags: [ Hierarchy ]
      summary: Get province details
      description: Get a single province by ID (user-only, requires installations:read scope)
      operationId: getProvince
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 2
      responses:
        '200':
          description: Province details
          headers:
            ETag:
              schema:
                type: string
            Last-Modified:
              schema:
                type: string
                format: date-time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Province'
        '400':
          description: Invalid path parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Province not found (or outside user's jurisdiction)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '406':
          description: Not acceptable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "304":
          $ref: "#/components/responses/NotModified"

  /provinces/{id}/districts:
    get:
      tags: [ Hierarchy ]
      summary: List districts in a province
      description: List districts for a specific province (user-only, requires installations:read scope)
      operationId: listProvinceDistricts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 2
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: sort
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of districts
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistrictCollection'
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Province not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "304":
          $ref: "#/components/responses/NotModified"

  /districts:
    get:
      tags: [ Hierarchy ]
      summary: List districts
      description: List all districts, optionally filtered by province (user-only, requires installations:read scope)
      operationId: listDistricts
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: sort
          in: query
          schema:
            type: string
        - name: province_id
          in: query
          schema:
            type: integer
          description: Filter by province
      responses:
        '200':
          description: List of districts
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistrictCollection'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "304":
          $ref: "#/components/responses/NotModified"

  /districts/{id}:
    get:
      tags: [ Hierarchy ]
      summary: Get district details
      description: Get a single district by ID (user-only, requires installations:read scope)
      operationId: getDistrict
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 4
      responses:
        '200':
          description: District details
          headers:
            ETag:
              schema:
                type: string
            Last-Modified:
              schema:
                type: string
                format: date-time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/District'
        '400':
          description: Invalid path parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: District not found (or outside user's jurisdiction)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
