                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Installation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "304":
          $ref: "#/components/responses/NotModified"
    post:
      tags: [ Ingestion ]
      summary: Create reading
      description: |
        Submit a meter reading from a device.
        Device-only, requires device token with readings:write scope.

        A device may only write to its own installation (bound at token creation).
        Replayed readings (same installation and recorded_at) return 409 Conflict with Location header.
        Rate-limited to protect ingestion channels.
      operationId: createReading
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 61
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ recorded_at, power_kw, energy_kwh, voltage_v ]
              properties:
                recorded_at:
                  type: string
                  format: date-time
                  example: "2026-09-24T14:30:00+05:30"
                power_kw:
                  type: number
                  format: double
                  minimum: 0
                  maximum: 1000
                  example: 6.2
                energy_kwh:
                  type: number
                  format: double
                  minimum: 0
                  example: 44.5
                voltage_v:
                  type: number
                  format: double
                  minimum: 0
                  maximum: 500
                  example: 232.1
      responses:
        '201':
          description: Reading created
          headers:
            Location:
              schema:
                type: string
                format: uri
              description: URL of the created reading
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reading'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Device bound to different installation (INSTALLATION_MISMATCH)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Installation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict — reading already exists for this timestamp
          headers:
            Location:
              schema:
                type: string
                format: uri
              description: URL of the existing reading
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Payload too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Unsupported media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests (rate limited)
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /installations/{id}/readings/{reading_id}:
