    post:
      tags: [ Assets ]
      summary: Create installation
      description: |
        Create a new solar installation. Admin-only, requires admin role and installations:write scope.

        The device_secret is returned in this response and nowhere else — store it securely before using it for authentication.
      operationId: createInstallation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reference
                - meter_id
                - inverter_id
                - capacity_kw
                - panel_count
                - status
                - commissioned_on
                - address_line
                - latitude
                - longitude
                - substation_id
              properties:
                reference:
                  type: string
                  maxLength: 32
                  example: KANDY-CENTRAL-002
                meter_id:
                  type: string
                  maxLength: 32
                  example: MTR-000043
                inverter_id:
                  type: string
                  maxLength: 48
                  example: INV-SMA-2026
                capacity_kw:
                  type: number
                  format: double
                  example: 10.5
                panel_count:
                  type: integer
                  example: 28
                status:
                  type: string
                  enum: [ active, inactive, decommissioned ]
                  example: active
                commissioned_on:
                  type: string
                  format: date
                  example: "2024-01-15"
                address_line:
                  type: string
                  maxLength: 160
                  example: 124 Temple Road, Kandy
                latitude:
                  type: number
                  format: double
                  example: 6.9271
                longitude:
                  type: number
                  format: double
                  example: 80.7789
                substation_id:
                  type: integer
                  example: 8
      responses:
        '201':
          description: Installation created
          headers:
            Location:
              schema:
                type: string
                format: uri
              description: URL of the created resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInstallationResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient scope or not admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Payload too large
          content:
            application/json:
