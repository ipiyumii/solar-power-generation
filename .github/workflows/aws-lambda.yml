name: Deploy to AWS Lambda

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Create Lambda deployment package
        run: |
          set -euo pipefail
          mkdir -p build/lambda

          cp -r app.js index.js lambda.js package.json package-lock.json \
                config/ db/ middleware/ utils/ routes/ services/ repositories/ \
                build/lambda/

          if [ ! -f build/lambda/db/rds-ca-bundle.pem ]; then
            echo "ERROR: db/rds-ca-bundle.pem is missing"
            exit 1
          fi

          cd build/lambda
          npm install --omit=dev --no-audit --no-fund

          # Load the handler exactly as Lambda will, from the staged package, so a
          # missing module fails the build instead of the deployed function.
          # The pool connects lazily, so dummy DB values are enough.
          NODE_ENV=test DB_HOST=localhost DB_NAME=x DB_USER=x DB_PASSWORD=x \
          PUBLIC_BASE_URL=https://example.invalid \
            node -e "require('./lambda.js').handler || process.exit(1)"

          # Zip the contents, not the folder: handler lambda.handler resolves
          # lambda.js at the archive root.
          zip -qr ../lambda-deploy.zip .
          cd ..
          unzip -l lambda-deploy.zip lambda.js > /dev/null || { echo "lambda.js not at zip root"; exit 1; }

          echo "Package size: $(du -h lambda-deploy.zip | cut -f1)"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Refuse work AWS accounts
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          echo "Deploying to account $ACCOUNT"
          case "$ACCOUNT" in
            571832387503|500345896497|955682923759)
              echo "ERROR: $ACCOUNT is a work account; coursework deploys only to the personal account"
              exit 1 ;;
          esac

      - name: Deploy Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name slsea-api \
            --zip-file fileb://build/lambda-deploy.zip \
            --region us-east-1

      - name: Wait for deployment
        run: |
          aws lambda wait function-updated \
            --function-name slsea-api \
            --region us-east-1

          echo "✓ Lambda deployment complete"

      - name: Test health endpoint
        run: |
          INVOKE_URL="https://4qfu2ftwie.execute-api.us-east-1.amazonaws.com"

          echo "Testing: $INVOKE_URL/health"
          # Retries absorb a cold start; a failure after that fails the job.
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$INVOKE_URL/health"
          echo
          echo "✓ Health check passed"
